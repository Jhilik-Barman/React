<!DOCTYPE html> <!-- Declares the document type -->

<html> <!-- Opens the root element of the HTML document -->

<head><!-- The head contains metadata and information for the browser (title, links to stylesheets, scripts, meta tags, etc.) -->

    <title>My Simple Page</title><!-- that appears in the browser tab -->

</head>
<body><!-- main content -->

    <h1>Hello, World!</h1><!-- heading -->

    <p>This is a simple HTML page.</p><!-- paragraph -->

</body>
</html>
